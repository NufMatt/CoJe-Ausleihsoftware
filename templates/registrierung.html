{% extends "base.html" %}
{% block content %}
<div class="mt-4">
  <h2>Ausleiher Registrierung</h2>
  <form method="POST" onsubmit="syncSignature()">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" name="name" id="name" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="contact">Kontakt/Adresse:</label>
      <input type="text" name="contact" id="contact" class="form-control">
    </div>
    <div class="form-group">
      <label for="bemerkung">Bemerkung:</label>
      <textarea name="bemerkung" id="bemerkung" class="form-control" rows="2"></textarea>
    </div>

    <div class="form-group">
      <label>Alter:</label>
      <div class="form-row">
        <div class="col-md-4">
          <input type="number" name="age" id="age" class="form-control"
                 min="1" max="120" placeholder="Alter"
                 oninput="calcYearFromAge()">
          <small class="form-text text-muted">Alter eingeben</small>
        </div>
        <div class="col-md-1 d-flex align-items-center justify-content-center">
          <span class="font-weight-bold">oder</span>
        </div>
        <div class="col-md-4">
          <input type="number" name="birth_year" id="birth_year" class="form-control"
                 min="1900" max="2099" placeholder="Geburtsjahr"
                 oninput="calcAgeFromYear()">
          <small class="form-text text-muted">Geburtsjahr eingeben</small>
        </div>
        <div class="col-md-3 d-flex align-items-center">
          <span class="font-weight-bold ml-2" id="age_display"></span>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="agb" id="agb" required>
          <label class="form-check-label" for="agb">AGBs gelesen</label>
        </div>
      </div>
      <div class="form-group col-md-6">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="liability" id="liability" required>
          <label class="form-check-label" for="liability">Haftungsausschluss zugestimmt</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Unterschrift:</label>
      <canvas id="signature-pad" class="border" width="400" height="200"></canvas>
      <button type="button" class="btn btn-sm btn-secondary mt-2" onclick="clearSignature()">Löschen</button>
      <input type="hidden" name="signature_data" id="signature_data">
    </div>

    <button type="submit" class="btn btn-primary">Registrieren</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script>
  const canvas = document.getElementById('signature-pad');
  const sigPad = new SignaturePad(canvas);
  function clearSignature() { sigPad.clear(); }
  function syncSignature() {
    if (!sigPad.isEmpty()) {
      document.getElementById('signature_data').value = sigPad.toDataURL();
    }
  }

  function calcYearFromAge() {
    const age = parseInt(document.getElementById('age').value);
    if (!isNaN(age) && age > 0) {
      document.getElementById('birth_year').value = new Date().getFullYear() - age;
      document.getElementById('age_display').textContent = age + ' Jahre';
    }
  }

  function calcAgeFromYear() {
    const year = parseInt(document.getElementById('birth_year').value);
    if (!isNaN(year) && year > 1900) {
      const age = new Date().getFullYear() - year;
      document.getElementById('age').value = age;
      document.getElementById('age_display').textContent = age + ' Jahre';
    }
  }
</script>
{% endblock %}
