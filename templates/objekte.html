{% extends "base.html" %}
{% block content %}
<div class="mt-4">
  <h2>Verfügbare Objekte</h2>
  <form method="POST" class="form-inline mb-3">
    <div class="form-group mr-2">
      <input type="text" name="name" class="form-control" placeholder="Objektname" required>
    </div>
    <div class="form-group mr-2">
      <input type="text" name="beschreibung" class="form-control" placeholder="Beschreibung">
    </div>
    <button type="submit" class="btn btn-primary">Hinzufügen</button>
  </form>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Beschreibung</th>
        <th>Aktion</th>
      </tr>
    </thead>
    <tbody>
      {% for obj in objekte %}
      <tr>
        <td>{{ obj.name }}</td>
        <td>{{ obj.beschreibung }}</td>
        <td>
          <form action="{{ url_for('delete_objekt', objekt_id=obj.id) }}" method="POST" onsubmit="return confirm('Objekt wirklich löschen?');">
            <button type="submit" class="btn btn-danger btn-sm">Löschen</button>
          </form>
          <a href="{{ url_for('edit_objekt', objekt_id=obj.id) }}" class="btn btn-info btn-sm">Bearbeiten</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
